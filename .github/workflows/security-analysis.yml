name: Security analysis

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      strict_known:
        description: "Fail on unresolved issue #41 cases"
        type: boolean
        default: false

concurrency:
  group: security-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install isolated scanner
        run: python -m pip install "semgrep==1.182.1"
      - name: Scan source and test custom rules
        run: python sprig-config-module/scripts/security_check.py --only semgrep
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-reports
          path: sprig-config-module/.security-reports/semgrep.*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Publish code scanning results
        if: always() && hashFiles('sprig-config-module/.security-reports/semgrep.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@793b778da9c9275a0f276522b27cb5fc14bba279 # v4
        with:
          sarif_file: sprig-config-module/.security-reports/semgrep.sarif
          category: semgrep

  security-tests:
    name: Security properties (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: sprig-config-module
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
      SECURITY_ENFORCE_KNOWN: ${{ inputs.strict_known && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Poetry
        run: python -m pip install "poetry==2.3.1"
      - name: Install locked dependencies
        run: poetry install --without docs --no-interaction
      - name: Security guarantees and known findings
        env:
          DEEP: ${{ github.event_name == 'schedule' && '--deep' || '' }}
        run: poetry run python scripts/security_check.py --only tests $DEEP
      - name: Audit all locked dependencies, including inactive platforms and groups
        if: matrix.python == '3.11'
        run: poetry run python scripts/security_check.py --only lock-audit
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-tests-${{ matrix.python }}
          path: sprig-config-module/.security-reports/security-tests.xml
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
