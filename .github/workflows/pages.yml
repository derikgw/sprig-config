name: Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate local markdown links
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          docs_root = pathlib.Path("docs")
          md_files = sorted(docs_root.rglob("*.md"))
          link_re = re.compile(r"(?<!!)\[[^\]]+\]\(([^)]+)\)")

          errors = []
          for md_file in md_files:
            text = md_file.read_text(encoding="utf-8")
            for match in link_re.finditer(text):
              target = match.group(1).strip()
              if not target or target.startswith("#"):
                continue
              if target.startswith(("http://", "https://", "mailto:", "tel:")):
                continue
              if target.startswith("<") and target.endswith(">"):
                target = target[1:-1].strip()

              rel = target.split("#", 1)[0].strip()
              if not rel:
                continue

              target_path = (md_file.parent / rel).resolve()
              if not target_path.exists():
                errors.append(f"{md_file}: missing link target '{target}'")

          if errors:
            print("Broken local markdown links found:")
            for err in errors:
              print(f"- {err}")
            sys.exit(1)

          print(f"Checked {len(md_files)} markdown files. All local links resolved.")
          PY

  build:
    needs: docs-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: docs
          destination: _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
